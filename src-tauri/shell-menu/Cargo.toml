[package]
name = "pdf-viewer-shell-menu"
version = "1.3.1"
description = "PDF 查看器：Windows 11 右键菜单第一层的「转成 PDF」（IExplorerCommand，经稀疏包登记）"
edition = "2021"

# 单独一个工程（不和 src-tauri 的程序合在一起编译）；构建见 tools/build-shell-menu.mjs，产物在 src-tauri/target/shell-menu
[workspace]

[lib]
name = "pdf_viewer_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
